name: expense_ocr_tracker
description: "Mini-Project 3: OCR Expense Tracker & Receipt Parser (Flutter & Dart)"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Camera & OCR
  camera: ^0.12.1
  google_mlkit_text_recognition: ^0.14.0
  image_picker: ^1.1.2

  # SQLite Database & Storage
  sqflite: ^2.4.1
  path_provider: ^2.1.5
  path: ^1.9.0

  # Utilities
  intl: ^0.20.2
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
